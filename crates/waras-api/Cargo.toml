[package]
name = "waras-api"
version = "0.1.0"
edition = "2021"
description = "WARAS HTTP API: Axum handlers, auth, RBAC guards"
license = "Apache-2.0"

[dependencies]
waras-core.workspace = true
waras-db.workspace = true
waras-bridge = { path = "../waras-bridge" }
waras-web.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Agen D (Fase 4): SHA-256 kunci API + RNG kriptografis untuk generate
# kunci `wrs_...` (keduanya sudah di workspace/cache, bukan dep baru).
sha2.workspace = true
rand.workspace = true
# Fase A/A4: header keamanan (tower-http SetHeader).
tower-http.workspace = true

[dev-dependencies]
# Hanya untuk test (oneshot): tower 0.5.3 sudah ada di cache registry.
tower = { version = "0.5.3", features = ["util"] }
