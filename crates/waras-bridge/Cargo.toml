[package]
name = "waras-bridge"
version = "0.1.0"
edition = "2021"
description = "WARAS national bridges: SATUSEHAT (FHIR) + BPJS adapters (VClaim/PCare/Antrean/Aplicares/E-Klaim)"
license = "Apache-2.0"

[dependencies]
waras-core = { path = "../waras-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"
sha2.workspace = true
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
cipher = "0.5"
base64 = "0.22"
async-trait = "0.1"

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
