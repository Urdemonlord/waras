[workspace]
resolver = "2"
members = [
    "crates/waras-core",
    "crates/waras-db",
    "crates/waras-api",
    "crates/waras-bridge",
    "crates/waras-web",
    "crates/waras",
]

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9" }
sqlx = { version = "0.8.6", features = ["sqlite", "postgres", "any", "runtime-tokio-rustls", "chrono", "uuid", "migrate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
argon2 = "0.5.3"
rust-embed = "8.13"
sha2 = "0.10.9"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.9.5"
futures-core = "0.3.34"
# Fase A/A4: header keamanan (SetHeaderLayer, fitur set-header tanpa
# dep tambahan — sudah di cache registry).
tower-http = { version = "0.6.11", features = ["set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"
base64 = "0.22"
async-trait = "0.1"

waras-core = { path = "crates/waras-core" }
waras-db = { path = "crates/waras-db" }
waras-api = { path = "crates/waras-api" }
waras-web = { path = "crates/waras-web" }

[profile.release]
lto = false
codegen-units = 1
